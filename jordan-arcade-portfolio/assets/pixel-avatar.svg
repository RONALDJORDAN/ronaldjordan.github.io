<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" shape-rendering="crispEdges">
  <!-- Dark Arcade Background -->
  <rect width="160" height="160" fill="#07131A"/>
  <rect x="4" y="4" width="152" height="152" fill="#0C1B24" stroke="#00F0FF" stroke-width="2"/>
  
  <!-- Cyber grid lines in background -->
  <line x1="8" y1="40" x2="152" y2="40" stroke="#143142" stroke-width="1"/>
  <line x1="8" y1="80" x2="152" y2="80" stroke="#143142" stroke-width="1"/>
  <line x1="8" y1="120" x2="152" y2="120" stroke="#143142" stroke-width="1"/>
  <line x1="40" y1="8" x2="40" y2="152" stroke="#143142" stroke-width="1"/>
  <line x1="80" y1="8" x2="80" y2="152" stroke="#143142" stroke-width="1"/>
  <line x1="120" y1="8" x2="120" y2="152" stroke="#143142" stroke-width="1"/>

  <!-- Character Hair (Dark retro pixel block) -->
  <rect x="52" y="24" width="56" height="28" fill="#0e1724"/>
  <rect x="48" y="28" width="64" height="20" fill="#1b2a3d"/>
  <rect x="56" y="20" width="44" height="12" fill="#2d4259"/>

  <!-- Headphones / Headset (Retro Arcade Gamer / Cyberpunk Headset) -->
  <rect x="40" y="44" width="12" height="28" fill="#00F0FF"/>
  <rect x="44" y="48" width="6" height="20" fill="#FFE600"/>
  <rect x="108" y="44" width="12" height="28" fill="#00F0FF"/>
  <rect x="110" y="48" width="6" height="20" fill="#FFE600"/>
  <rect x="48" y="20" width="64" height="6" fill="#00F0FF"/>

  <!-- Face Skin Tone -->
  <rect x="54" y="40" width="52" height="44" fill="#ffd1a4"/>
  <rect x="54" y="60" width="52" height="24" fill="#f5be87"/>

  <!-- Pixel Eyes & Eyebrows -->
  <rect x="60" y="48" width="12" height="4" fill="#15212d"/>
  <rect x="88" y="48" width="12" height="4" fill="#15212d"/>
  <rect x="64" y="56" width="8" height="8" fill="#00F0FF"/>
  <rect x="68" y="58" width="4" height="4" fill="#051017"/>
  <rect x="88" y="56" width="8" height="8" fill="#00F0FF"/>
  <rect x="92" y="58" width="4" height="4" fill="#051017"/>

  <!-- Nose & Confident Smirk -->
  <rect x="76" y="64" width="6" height="6" fill="#e0a36b"/>
  <rect x="72" y="74" width="16" height="4" fill="#c47a40"/>
  <rect x="84" y="72" width="4" height="2" fill="#c47a40"/>

  <!-- Cybernetic Glow on Cheek/Jaw -->
  <rect x="96" y="68" width="8" height="2" fill="#00FF66"/>
  <rect x="98" y="72" width="6" height="2" fill="#00FF66"/>

  <!-- Jacket / Collar (Retro 80s Synthwave Jacket) -->
  <rect x="44" y="88" width="72" height="52" fill="#192a38"/>
  <rect x="36" y="96" width="88" height="52" fill="#14212d"/>
  <!-- Neon Trims -->
  <rect x="58" y="92" width="8" height="48" fill="#FF0055"/>
  <rect x="94" y="92" width="8" height="48" fill="#00F0FF"/>
  <rect x="66" y="100" width="28" height="40" fill="#060e14"/>
  <!-- Inner T-shirt Code Logo -->
  <rect x="72" y="112" width="16" height="4" fill="#FFE600"/>
  <rect x="76" y="120" width="8" height="4" fill="#FFE600"/>

  <!-- Corner Brackets in HUD -->
  <rect x="8" y="8" width="12" height="2" fill="#00F0FF"/>
  <rect x="8" y="8" width="2" height="12" fill="#00F0FF"/>
  <rect x="140" y="8" width="12" height="2" fill="#00F0FF"/>
  <rect x="150" y="8" width="2" height="12" fill="#00F0FF"/>
  <rect x="8" y="150" width="12" height="2" fill="#00F0FF"/>
  <rect x="8" y="140" width="2" height="12" fill="#00F0FF"/>
  <rect x="140" y="150" width="12" height="2" fill="#00F0FF"/>
  <rect x="150" y="140" width="2" height="12" fill="#00F0FF"/>
</svg>